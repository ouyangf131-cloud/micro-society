<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<title>微型社会模拟器</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#f4f1ea;color:#2b2a27;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:12px 12px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:21px;margin:4px 0 2px}
.sub{color:#77736a;font-size:13px;margin:0 0 10px}
.card{background:#fff;border-radius:14px;padding:12px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
button,select,input{font:inherit;color:inherit}
button{min-height:44px;min-width:44px;border:0;border-radius:11px;padding:0 12px;background:#e9e4d8;cursor:pointer;touch-action:manipulation}
button.primary{background:#2f6f5e;color:#fff}
button.warn{background:#f1d9d2;color:#8a3324}
button:active{filter:brightness(.92)}
select,input{min-height:44px;border:1px solid #d6d0c3;border-radius:11px;padding:0 10px;background:#fff;max-width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ctrl button{width:100%}
.seedrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;margin-top:8px}
.seedrow input{width:100%}
.speedrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center;margin-top:8px}
.daybar{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.day{font-size:26px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stat{background:#f7f5ef;border-radius:10px;padding:6px 4px;text-align:center;min-width:0}
.stat b{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat span{font-size:11.5px;color:#77736a}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;position:sticky;top:0;z-index:5;background:#f4f1ea;padding:6px 0}
.tabs button{width:100%;padding:0 4px}
.tabs button.on{background:#2f6f5e;color:#fff}
.chart{margin:4px 0 14px}
.chart h3{font-size:15px;margin:0 0 2px}
.chart p{font-size:12px;color:#77736a;margin:0 0 4px}
canvas{display:block;width:100%;height:190px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:#55524b}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.plist{display:flex;flex-direction:column;gap:6px}
.person{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;text-align:left;width:100%;min-height:52px;background:#f7f5ef;padding:6px 10px}
.person .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .meta{font-size:12px;color:#77736a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .w{font-variant-numeric:tabular-nums;text-align:right;font-size:13px}
.person.dead{opacity:.5}
.logl{list-style:none;margin:0;padding:0}
.logl li{padding:6px 0;border-bottom:1px solid #eee8db;font-size:13.5px;word-break:break-all}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:0 6px;margin-right:6px;color:#fff;vertical-align:1px}
.rules h3{font-size:16px;margin:14px 0 4px}
.rules ul{padding-left:20px;margin:4px 0}
.rules li{margin:3px 0}
.rules code{background:#f1ede3;border-radius:4px;padding:0 4px;font-size:13px;word-break:break-all}
.rules table{border-collapse:collapse;width:100%;font-size:13px}
.rules td,.rules th{border:1px solid #e3ddcf;padding:4px;text-align:left}
pre{white-space:pre-wrap;word-break:break-all;font-size:11.5px;background:#f7f5ef;padding:8px;border-radius:8px;max-height:360px;overflow:auto}
details summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:20;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.panel{background:#fff;width:100%;max-width:760px;max-height:86vh;overflow-y:auto;overflow-x:hidden;border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
.phead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.phead h2{margin:0;font-size:20px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:9px;background:#eee8db;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:#2f6f5e}
.kv{display:grid;grid-template-columns:5.5em minmax(0,1fr) 3.2em;gap:6px;align-items:center;font-size:13.5px;margin:4px 0}
.kv span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;font-size:13.5px}
.grid2 div{background:#f7f5ef;border-radius:8px;padding:6px 8px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:13.5px;padding:0 10px}
.muted{color:#77736a;font-size:13px}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>微型社会模拟器</h1>
  <p class="sub">100 位虚拟居民，在本地浏览器里自己干活、交易、合作、吵架、交朋友。所有随机都来自下面的「种子」，同一个种子结果完全一样。</p>

  <div class="card">
    <div class="daybar"><div class="day" id="dayLabel">第 0 天</div><div class="muted" id="perfLabel"></div></div>
    <div class="ctrl" style="margin-top:8px">
      <button class="primary" id="btnStep">前进 1 天</button>
      <button id="btnRun">▶ 自动运行</button>
      <button id="btnStep30">前进 30 天</button>
    </div>
    <div class="speedrow">
      <label for="speed" class="muted">速度</label>
      <select id="speed">
        <option value="1">每秒 1 天</option>
        <option value="4" selected>每秒 4 天</option>
        <option value="15">每秒 15 天</option>
        <option value="60">每秒 60 天（快进）</option>
      </select>
    </div>
    <div class="seedrow">
      <label for="seedInput" class="muted">种子</label>
      <input id="seedInput" type="number" inputmode="numeric" min="0" max="4294967295">
      <button id="btnRandSeed" aria-label="换一个随机种子">🎲</button>
      <button class="warn" id="btnReset">重置</button>
    </div>
    <p class="muted" style="margin:6px 0 0">改种子后点「重置」生效。当前状态指纹：<code id="hashLabel"></code></p>
  </div>

  <div class="card">
    <div class="stats" id="stats"></div>
  </div>

  <div class="tabs" role="tablist">
    <button data-tab="charts" class="on">图表</button>
    <button data-tab="people">居民</button>
    <button data-tab="log">今日事件</button>
    <button data-tab="rules">规则说明</button>
  </div>

  <section class="card" id="tab-charts">
    <div class="chart"><h3>财富分布（直方图）</h3><p>横轴：财富区间（元，财富 = 现金 + 食物×食物价 + 物品×物品价）；纵轴：人数</p><canvas id="cHist"></canvas></div>
    <div class="chart"><h3>贫富差距：基尼系数</h3><p>0 = 人人一样多，1 = 一个人拥有全部。按天记录。</p><canvas id="cGini"></canvas></div>
    <div class="chart"><h3>人口</h3><div class="legend" id="lgPop"></div><canvas id="cPop"></canvas></div>
    <div class="chart"><h3>资源消耗（每天）</h3><div class="legend" id="lgRes"></div><canvas id="cRes"></canvas></div>
    <div class="chart"><h3>合作与冲突（每天次数）</h3><div class="legend" id="lgSoc"></div><canvas id="cSoc"></canvas></div>
    <div class="chart"><h3>市场价格</h3><div class="legend" id="lgPrice"></div><canvas id="cPrice"></canvas></div>
  </section>

  <section class="card hide" id="tab-people">
    <div class="row" style="margin-bottom:8px">
      <label for="sortSel" class="muted">排序</label>
      <select id="sortSel" style="flex:1">
        <option value="wealth">按财富（高→低）</option>
        <option value="poor">按财富（低→高）</option>
        <option value="health">按健康（低→高）</option>
        <option value="friends">按朋友数</option>
        <option value="id">按编号</option>
      </select>
      <select id="filterSel" style="flex:1">
        <option value="alive">只看在世</option>
        <option value="all">全部（含去世）</option>
        <option value="dead">只看去世</option>
      </select>
    </div>
    <p class="muted" style="margin:0 0 6px">点任意居民查看详情。</p>
    <div class="plist" id="plist"></div>
  </section>

  <section class="card hide" id="tab-log">
    <p class="muted" id="logHead" style="margin:0 0 6px"></p>
    <div class="row" style="margin-bottom:6px"><select id="logFilter" style="flex:1">
      <option value="all">全部类型</option><option value="trade">交易</option><option value="coop">合作</option><option value="share">分享</option>
      <option value="conflict">冲突</option><option value="rel">关系</option><option value="heal">治疗</option><option value="welfare">救济</option>
      <option value="birth">出生</option><option value="death">死亡</option><option value="job">职业</option></select></div>
    <ul class="logl" id="logList"></ul>
  </section>

  <section class="card hide rules" id="tab-rules"></section>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="panel" id="panel"></div>
</div>

<script>
/* ===== 模拟引擎：所有规则数值都来自 CONFIG（规则说明也由 CONFIG 生成） ===== */
const CONFIG = {
  population: 100,
  maxPopulation: 300,
  defaultSeed: 20261107,
  jobs: {
    farmer:   { name: '农夫', count: 32, product: 'food',  base: 2.9, variance: 0.2 },
    fisher:   { name: '渔夫', count: 20, product: 'food',  base: 2.7, variance: 0.6 },
    artisan:  { name: '工匠', count: 28, product: 'goods', base: 2.8, variance: 0.2 },
    merchant: { name: '商人', count: 12, product: null,    base: 0,   variance: 0 },
    doctor:   { name: '医生', count: 8,  product: null,    base: 0,   variance: 0 }
  },
  init: { ageMin: 18, ageMax: 62, moneyMedian: 50, moneySpread: 0.6, foodMin: 4, foodMax: 10,
          goodsMin: 2, goodsMax: 5, skillMin: 0.1, skillMax: 0.6, acquaintances: 3, acqRelMin: 10, acqRelMax: 40,
          needMin: 70 },
  needs: { satietyDecay: 30, satietyPerFood: 20, maxFoodPerDay: 3, eatUntil: 90, goodsPerDay: 1,
           restBase: 20, restGoodsBonus: 15, restFedBonus: 10, fedThreshold: 50,
           starveHealthLoss: 15, exhaustedEnergy: 10, exhaustedHealthLoss: 5,
           healthRegen: 3, regenSatiety: 50, regenEnergy: 30 },
  work: { adultAge: 16, energyCost: 30, minEnergy: 20, minHealth: 20, skillFactorBase: 0.6,
          healthWeight: 0.5, skillGain: 0.001, coopBoost: 0.15 },
  market: { foodTarget: 6, foodSellAbove: 8, goodsTarget: 3, goodsSellAbove: 5,
            foodPrice0: 3, goodsPrice0: 4, greedMarkup: 0.3, merchantFee: 0.10,
            priceAdjust: 0.05, priceMin: 0.5, priceMax: 30, tradeRelGain: 1 },
  spoil: { foodRate: 0.03 },
  social: { meetBase: 1, meetExtra: 3, friendPick: 0.5, friendThreshold: 30, enemyThreshold: -30,
            coopBase: 0.20, coopKind: 0.35, coopRel: 0.003,
            conflictBase: 0.02, conflictAggr: 0.12, conflictHunger: 0.10, hungerSatiety: 20,
            conflictEnvy: 0.06, envyRatio: 2, conflictRel: 0.002, maxProb: 0.9,
            coopRelGain: 6, chatRelGain: 1, conflictRelLoss: 20,
            fightHealthW: 0.5, fightEnergyW: 0.3, fightAggrW: 30, fightLuck: 30,
            robRate: 0.15, robMax: 15, loserHealthLoss: 12, winnerHealthLoss: 4,
            shareKind: 0.3, shareNeedFood: 2, shareGiverMin: 6, shareMax: 3, shareRelGain: 8,
            relDecay: 0.995, relForget: 0.5 },
  doctor: { healBelow: 70, healAmount: 25, fee: 6, maxPatients: 3, freeKind: 0.6 },
  life: { oldAge: 65, oldAgeRisk: 0.0004, childFoodPerDay: 2 },
  birth: { enabled: true, minAge: 18, maxAge: 45, partnerRel: 60, minSatiety: 50, minMoney: 30,
           dailyChance: 0.004, cooldown: 300, giftEach: 10, parentRel: 50, traitNoise: 0.3, babySatiety: 80, babyEnergy: 80, babyHealth: 100 },
  welfare: { enabled: true, taxThreshold: 100, taxRate: 0.02, povertyLine: 10 },
  jobSwitch: { every: 30, bottomShare: 0.1, newSkill: 0.2 },
  limits: { historyDays: 5000, logPerDay: 300, personalLog: 12 }
};

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const SURNAMES = '王李张刘陈杨黄赵吴周徐孙马朱胡郭何高林罗郑梁谢宋唐许韩冯邓曹彭曾萧田董袁潘于蒋蔡余杜叶程苏魏吕丁任沈姚卢姜崔钟谭陆汪范金石廖贾夏韦付方白邹孟熊秦邱江尹薛闫段雷侯龙史陶黎贺顾毛郝龚邵万钱严覃武戴莫孔向汤';
const GIVEN = '安宁浩然子轩雨桐思远嘉怡梓涵晨曦一鸣欣怡俊杰诗琪志强秀英建华丽娟明辉晓燕文博雅静天佑若曦家豪梦瑶宇航佳琪振宇美玲国庆春花海涛凤霞';

function createSim(seed) {
  const C = CONFIG;
  const rng = mulberry32(seed >>> 0);
  const R = () => rng();
  const rint = (a, b) => a + Math.floor(R() * (b - a + 1));
  const rr = (a, b) => a + R() * (b - a);
  const gauss = () => { let u = 0, v = 0; while (u === 0) u = R(); v = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
  const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; };

  const S = {
    seed: seed >>> 0, day: 0, people: [], byId: new Map(), nextId: 1,
    prices: { food: C.market.foodPrice0, goods: C.market.goodsPrice0 },
    totals: { dead: 0, births: 0 }, today: null, log: [], history: [], usedNames: new Set()
  };

  function makeName(surname) {
    for (let k = 0; k < 50; k++) {
      const s = surname || SURNAMES[Math.floor(R() * SURNAMES.length)];
      const g = R() < 0.5 ? GIVEN[Math.floor(R() * GIVEN.length)] : GIVEN[Math.floor(R() * GIVEN.length)] + GIVEN[Math.floor(R() * GIVEN.length)];
      const n = s + g;
      if (!S.usedNames.has(n)) { S.usedNames.add(n); return n; }
    }
    const n = (surname || '无') + '名' + S.nextId; S.usedNames.add(n); return n;
  }

  function newPerson(o) {
    const p = Object.assign({
      id: S.nextId++, name: '', age: 20, job: null, skill: 0.3,
      kind: R(), greed: R(), aggr: R(), social: R(),
      money: 0, food: 0, goods: 0, satiety: 80, energy: 80, health: 90,
      rel: new Map(), alive: true, deathDay: null, cause: '', parents: [], children: [],
      bornDay: 0, coopBuff: false, worked: false, earn: 0, lastBirth: -1e9, plog: []
    }, o);
    S.people.push(p); S.byId.set(p.id, p);
    return p;
  }

  function log(type, text, ids) {
    const t = S.today;
    if (t.log.length < C.limits.logPerDay) t.log.push({ type, text }); else t.logDropped++;
    if (ids) for (const id of ids) {
      const p = S.byId.get(id); if (!p) continue;
      p.plog.push('第' + S.day + '天：' + text);
      if (p.plog.length > C.limits.personalLog) p.plog.shift();
    }
  }

  const getRel = (a, b) => a.rel.get(b.id) || 0;
  function addRel(a, b, d) {
    const old = getRel(a, b);
    const v = clamp(old + d, -100, 100);
    a.rel.set(b.id, v); b.rel.set(a.id, v);
    const F = C.social.friendThreshold, E = C.social.enemyThreshold;
    if (old < F && v >= F) { S.today.newFriends++; log('rel', a.name + ' 和 ' + b.name + ' 成为朋友', [a.id, b.id]); }
    else if (old >= F && v < F) { S.today.brokenFriends++; log('rel', a.name + ' 和 ' + b.name + ' 友谊破裂', [a.id, b.id]); }
    if (old > E && v <= E) { S.today.newEnemies++; log('rel', a.name + ' 和 ' + b.name + ' 结仇', [a.id, b.id]); }
  }

  const isAdult = p => p.alive && p.age >= C.work.adultAge;
  const wealth = p => p.money + p.food * S.prices.food + p.goods * S.prices.goods;

  // ---------- 初始化 ----------
  const jobKeys = Object.keys(C.jobs);
  const jobList = [];
  for (const k of jobKeys) for (let i = 0; i < C.jobs[k].count; i++) jobList.push(k);
  while (jobList.length < C.population) jobList.push(jobKeys[0]);
  shuffle(jobList);
  for (let i = 0; i < C.population; i++) {
    const I = C.init;
    newPerson({
      name: makeName(), age: rr(I.ageMin, I.ageMax), job: jobList[i], skill: rr(I.skillMin, I.skillMax),
      money: Math.round(I.moneyMedian * Math.exp(I.moneySpread * gauss()) * 100) / 100,
      food: rint(I.foodMin, I.foodMax), goods: rint(I.goodsMin, I.goodsMax),
      satiety: rr(I.needMin, 100), energy: rr(I.needMin, 100), health: rr(I.needMin + 10, 100)
    });
  }
  S.today = newToday();
  for (const p of S.people) {
    for (let k = 0; k < C.init.acquaintances; k++) {
      const q = S.people[Math.floor(R() * S.people.length)];
      if (q !== p) { const v = rr(C.init.acqRelMin, C.init.acqRelMax); p.rel.set(q.id, v); q.rel.set(p.id, v); }
    }
  }
  S.log = [];
  record();

  function newToday() {
    return { trades: 0, coop: 0, conflict: 0, share: 0, heal: 0, foodEaten: 0, goodsUsed: 0, foodProduced: 0,
      goodsProduced: 0, foodSpoiled: 0, deaths: 0, births: 0, newFriends: 0, brokenFriends: 0, newEnemies: 0, taxed: 0, aided: 0,
      log: [], logDropped: 0 };
  }

  function gini(vals) {
    const n = vals.length; if (n < 2) return 0;
    const v = vals.map(x => Math.max(0, x)).sort((a, b) => a - b);
    let sum = 0, cum = 0;
    for (let i = 0; i < n; i++) { sum += v[i]; cum += (i + 1) * v[i]; }
    if (sum <= 0) return 0;
    return (2 * cum) / (n * sum) - (n + 1) / n;
  }

  function record() {
    const alive = S.people.filter(p => p.alive);
    const w = alive.map(wealth);
    let friends = 0, enemies = 0;
    for (const p of alive) for (const [id, v] of p.rel) { if (id > p.id) { const q = S.byId.get(id); if (q && q.alive) { if (v >= C.social.friendThreshold) friends++; else if (v <= C.social.enemyThreshold) enemies++; } } }
    const t = S.today;
    S.history.push({
      day: S.day, alive: alive.length, dead: S.totals.dead, births: S.totals.births,
      gini: gini(w), totalWealth: w.reduce((a, b) => a + b, 0), totalMoney: alive.reduce((a, p) => a + p.money, 0),
      foodStock: alive.reduce((a, p) => a + p.food, 0), goodsStock: alive.reduce((a, p) => a + p.goods, 0),
      foodEaten: t.foodEaten, goodsUsed: t.goodsUsed, foodProduced: t.foodProduced, goodsProduced: t.goodsProduced,
      foodSpoiled: t.foodSpoiled, coop: t.coop, conflict: t.conflict, share: t.share, trades: t.trades, heal: t.heal, taxed: t.taxed, aided: t.aided,
      foodPrice: S.prices.food, goodsPrice: S.prices.goods, friends, enemies
    });
    if (S.history.length > C.limits.historyDays) S.history.splice(1, 1); // 保留第0天，丢弃最早的
    S.log = t.log; S.logDropped = t.logDropped;
  }

  // ---------- 每日阶段 ----------
  function phaseWork() {
    const W = C.work;
    for (const p of S.people) {
      p.worked = false;
      if (!isAdult(p)) continue;
      if (p.energy < W.minEnergy || p.health < W.minHealth) continue;
      p.worked = true; p.energy -= W.energyCost;
      const J = C.jobs[p.job];
      if (J.product) {
        const out = J.base * (W.skillFactorBase + p.skill) * (1 - W.healthWeight + W.healthWeight * p.health / 100)
          * (p.coopBuff ? 1 + W.coopBoost : 1) * (1 - J.variance + 2 * J.variance * R());
        p[J.product] += out;
        if (J.product === 'food') S.today.foodProduced += out; else S.today.goodsProduced += out;
      }
      p.skill = Math.min(1, p.skill + W.skillGain);
      p.coopBuff = false;
    }
  }

  function phaseDoctor() {
    const D = C.doctor;
    const docs = S.people.filter(p => p.worked && p.job === 'doctor');
    if (!docs.length) return;
    const patients = S.people.filter(p => p.alive && p.health < D.healBelow).sort((a, b) => a.health - b.health || a.id - b.id);
    let i = 0;
    for (const d of docs) {
      let n = 0;
      while (n < D.maxPatients && i < patients.length) {
        const pt = patients[i++];
        if (pt === d) continue;
        if (pt.money >= D.fee) { pt.money -= D.fee; d.money += D.fee; d.earn += D.fee; }
        else if (d.kind <= D.freeKind) continue;
        pt.health = Math.min(100, pt.health + D.healAmount); n++; S.today.heal++;
        log('heal', d.name + '（医生）为 ' + pt.name + ' 治疗', [d.id, pt.id]);
      }
    }
  }

  function phaseMarket(kind) {
    const M = C.market;
    const target = kind === 'food' ? M.foodTarget : M.goodsTarget;
    const sellAbove = kind === 'food' ? M.foodSellAbove : M.goodsSellAbove;
    const price = S.prices[kind];
    const merchants = S.people.filter(p => p.worked && p.job === 'merchant');
    const fee = merchants.length ? M.merchantFee : 0;
    const sellers = S.people.filter(p => isAdult(p) && p[kind] > sellAbove)
      .map(p => ({ p, ask: price * (1 + M.greedMarkup * p.greed), qty: Math.floor(p[kind] - sellAbove) }))
      .sort((a, b) => a.ask - b.ask || a.p.id - b.p.id);
    const buyers = shuffle(S.people.filter(p => isAdult(p) && p[kind] < target));
    let supply = sellers.reduce((a, s) => a + s.qty, 0), demand = 0, pool = 0, units = 0;
    for (const b of buyers) {
      let need = Math.ceil(target - b[kind]); demand += need;
      for (const s of sellers) {
        if (need <= 0) break;
        if (s.qty <= 0) continue;
        const unit = s.ask * (1 + fee);
        const q = Math.min(need, s.qty, Math.floor(b.money / unit));
        if (q <= 0) break;
        b.money -= q * unit; s.p.money += q * s.ask; s.p.earn += q * s.ask; pool += q * s.ask * fee;
        b[kind] += q; s.p[kind] -= q; s.qty -= q; need -= q; units += q;
        S.today.trades++;
        addRel(b, s.p, M.tradeRelGain);
      }
    }
    if (merchants.length && pool > 0) { const each = pool / merchants.length; for (const m of merchants) { m.money += each; m.earn += each; } }
    if (demand + supply > 0) S.prices[kind] = clamp(price * (1 + M.priceAdjust * (demand - supply) / (demand + supply)), M.priceMin, M.priceMax);
    if (units > 0) log('trade', (kind === 'food' ? '食物' : '物品') + '市场成交 ' + units + ' 单位，新价格 ' + S.prices[kind].toFixed(2) + ' 元');
  }

  function pickPartner(a, adults) {
    const SC = C.social;
    if (R() < SC.friendPick) {
      const fr = [];
      for (const [id, v] of a.rel) if (v >= SC.friendThreshold) { const q = S.byId.get(id); if (q && isAdult(q)) fr.push(q); }
      if (fr.length) { fr.sort((x, y) => x.id - y.id); return fr[Math.floor(R() * fr.length)]; }
    }
    if (adults.length < 2) return null;
    let b; do { b = adults[Math.floor(R() * adults.length)]; } while (b === a);
    return b;
  }

  function phaseSocial() {
    const SC = C.social;
    const adults = S.people.filter(isAdult);
    const wealthCache = new Map(adults.map(p => [p.id, wealth(p)]));
    for (const a of shuffle(adults.slice())) {
      const meets = SC.meetBase + Math.round(a.social * SC.meetExtra);
      for (let k = 0; k < meets; k++) {
        if (!a.alive) break;
        const b = pickPartner(a, adults);
        if (!b || !b.alive) continue;
        const r = getRel(a, b);
        // 分享：对方缺粮、自己有余粮、自己足够善良、关系不是负数
        if (b.food < SC.shareNeedFood && a.food > SC.shareGiverMin && a.kind > SC.shareKind && r >= 0) {
          const g = Math.min(SC.shareMax, Math.floor(a.food - SC.shareGiverMin));
          if (g > 0) { a.food -= g; b.food += g; S.today.share++; addRel(a, b, SC.shareRelGain);
            log('share', a.name + ' 分给 ' + b.name + ' ' + g + ' 份食物', [a.id, b.id]); }
        }
        const wa = wealthCache.get(a.id), wb = wealthCache.get(b.id);
        const pConf = clamp(SC.conflictBase + SC.conflictAggr * (a.aggr + b.aggr) / 2
          + (a.satiety < SC.hungerSatiety ? SC.conflictHunger : 0)
          + (wb > SC.envyRatio * wa ? SC.conflictEnvy * a.greed : 0) - SC.conflictRel * r, 0, SC.maxProb);
        const pCoop = clamp(SC.coopBase + SC.coopKind * (a.kind + b.kind) / 2 + SC.coopRel * r, 0, SC.maxProb);
        const u = R();
        if (u < pConf) {
          const sa = a.health * SC.fightHealthW + a.energy * SC.fightEnergyW + a.aggr * SC.fightAggrW + R() * SC.fightLuck;
          const sb = b.health * SC.fightHealthW + b.energy * SC.fightEnergyW + b.aggr * SC.fightAggrW + R() * SC.fightLuck;
          const win = sa >= sb ? a : b, lose = win === a ? b : a;
          const loot = Math.min(lose.money * SC.robRate, SC.robMax);
          lose.money -= loot; win.money += loot;
          lose.health -= SC.loserHealthLoss; win.health -= SC.winnerHealthLoss;
          addRel(a, b, -SC.conflictRelLoss); S.today.conflict++;
          log('conflict', a.name + ' 与 ' + b.name + ' 发生冲突，' + win.name + ' 占上风，抢走 ' + loot.toFixed(1) + ' 元', [a.id, b.id]);
        } else if (u < pConf + pCoop) {
          a.coopBuff = true; b.coopBuff = true; addRel(a, b, SC.coopRelGain); S.today.coop++;
          log('coop', a.name + ' 与 ' + b.name + ' 合作干活（明天产量 +' + Math.round(C.work.coopBoost * 100) + '%）', [a.id, b.id]);
        } else {
          addRel(a, b, SC.chatRelGain);
        }
      }
    }
  }

  function phaseFeedChildren() {
    const L = C.life, SC = C.social;
    for (const c of S.people) {
      if (!c.alive || c.age >= C.work.adultAge) continue;
      let need = L.childFoodPerDay;
      const carers = c.parents.map(id => S.byId.get(id)).filter(p => p && p.alive).sort((a, b) => b.food - a.food);
      if (!carers.length) {
        const g = S.people.filter(p => isAdult(p) && p.kind > SC.shareKind && p.food > SC.shareGiverMin).sort((a, b) => b.food - a.food || a.id - b.id)[0];
        if (g) carers.push(g);
      }
      for (const p of carers) { const g = Math.min(need, Math.floor(p.food)); if (g > 0) { p.food -= g; c.food += g; need -= g; } if (need <= 0) break; }
    }
  }

  function phaseConsume() {
    const N = C.needs;
    for (const p of S.people) {
      if (!p.alive) continue;
      p.satiety -= N.satietyDecay;
      let eaten = 0;
      while (p.satiety < N.eatUntil && eaten < N.maxFoodPerDay && p.food >= 1) { p.food -= 1; p.satiety += N.satietyPerFood; eaten++; }
      S.today.foodEaten += eaten;
      p.satiety = clamp(p.satiety, 0, 100);
      let used = false;
      if (p.age >= C.work.adultAge && p.goods >= N.goodsPerDay) { p.goods -= N.goodsPerDay; used = true; S.today.goodsUsed += N.goodsPerDay; }
      p.energy = clamp(p.energy + N.restBase + (used ? N.restGoodsBonus : 0) + (p.satiety > N.fedThreshold ? N.restFedBonus : 0), 0, 100);
      if (p.satiety <= 0) p.health -= N.starveHealthLoss;
      if (p.energy < N.exhaustedEnergy) p.health -= N.exhaustedHealthLoss;
      if (p.satiety > N.regenSatiety && p.energy > N.regenEnergy) p.health += N.healthRegen;
      p.health = Math.min(100, p.health);
      const sp = p.food * C.spoil.foodRate; p.food -= sp; S.today.foodSpoiled += sp;
    }
  }

  function die(p, cause) {
    p.alive = false; p.deathDay = S.day; p.cause = cause; S.totals.dead++; S.today.deaths++;
    let heir = p.children.map(id => S.byId.get(id)).find(q => q && q.alive);
    if (!heir) { let best = 0; for (const [id, v] of p.rel) { const q = S.byId.get(id); if (q && q.alive && v > best) { best = v; heir = q; } } }
    const w = p.money.toFixed(1);
    if (heir) { heir.money += p.money; heir.food += p.food; heir.goods += p.goods; }
    p.money = 0; p.food = 0; p.goods = 0;
    log('death', p.name + ' 去世（' + cause + '）' + (heir ? '，遗产 ' + w + ' 元由 ' + heir.name + ' 继承' : '，无人继承，遗产散失'), [p.id].concat(heir ? [heir.id] : []));
  }

  function phaseDeath() {
    const L = C.life;
    for (const p of S.people) {
      if (!p.alive) continue;
      if (p.health <= 0) die(p, p.satiety <= 0 ? '饥饿' : '伤病');
      else if (p.age > L.oldAge && R() < L.oldAgeRisk * (p.age - L.oldAge)) die(p, '年老');
    }
  }

  function phaseBirth() {
    const B = C.birth;
    if (!B.enabled) return;
    let alive = S.people.reduce((a, p) => a + (p.alive ? 1 : 0), 0);
    const cands = S.people.filter(p => p.alive && p.age >= B.minAge && p.age <= B.maxAge);
    for (const a of cands) {
      if (alive >= C.maxPopulation) break;
      for (const [id, v] of a.rel) {
        if (id <= a.id || v < B.partnerRel) continue;
        const b = S.byId.get(id);
        if (!b || !b.alive || b.age < B.minAge || b.age > B.maxAge) continue;
        if (a.satiety < B.minSatiety || b.satiety < B.minSatiety || a.money + b.money < B.minMoney) continue;
        if (S.day - a.lastBirth < B.cooldown || S.day - b.lastBirth < B.cooldown) continue;
        if (R() >= B.dailyChance) continue;
        const mix = (x, y) => clamp((x + y) / 2 + (R() - 0.5) * B.traitNoise, 0, 1);
        const ga = Math.min(B.giftEach, a.money), gb = Math.min(B.giftEach, b.money);
        a.money -= ga; b.money -= gb;
        const c = newPerson({ name: makeName(a.name[0]), age: 0, job: a.job, skill: 0, money: ga + gb,
          kind: mix(a.kind, b.kind), greed: mix(a.greed, b.greed), aggr: mix(a.aggr, b.aggr), social: mix(a.social, b.social),
          satiety: B.babySatiety, energy: B.babyEnergy, health: B.babyHealth, parents: [a.id, b.id], bornDay: S.day });
        a.children.push(c.id); b.children.push(c.id); a.lastBirth = b.lastBirth = S.day;
        c.rel.set(a.id, B.parentRel); a.rel.set(c.id, B.parentRel); c.rel.set(b.id, B.parentRel); b.rel.set(c.id, B.parentRel);
        S.totals.births++; S.today.births++; alive++;
        log('birth', a.name + ' 和 ' + b.name + ' 的孩子 ' + c.name + ' 出生', [a.id, b.id, c.id]);
      }
    }
  }

  function phaseWelfare() {
    const Wf = C.welfare;
    if (!Wf.enabled) return;
    const adults = S.people.filter(isAdult);
    let pot = 0;
    for (const p of adults) if (p.money > Wf.taxThreshold) { const t = (p.money - Wf.taxThreshold) * Wf.taxRate; p.money -= t; pot += t; }
    const poor = adults.filter(p => p.money < Wf.povertyLine);
    S.today.taxed = pot;
    if (pot <= 0) return;
    if (!poor.length) { const each = pot / adults.length; for (const p of adults) p.money += each; return; }
    const each = pot / poor.length;
    for (const p of poor) p.money += each;
    S.today.aided = poor.length;
    log('welfare', '公共救济：向富人收税 ' + pot.toFixed(1) + ' 元，平均发给 ' + poor.length + ' 位穷人（每人 ' + each.toFixed(2) + ' 元）');
  }

  function phaseJobSwitch() {
    const J = C.jobSwitch;
    if (S.day % J.every !== 0) return;
    const adults = S.people.filter(isAdult);
    const sum = {}, cnt = {};
    for (const k of jobKeys) { sum[k] = 0; cnt[k] = 0; }
    for (const p of adults) { sum[p.job] += p.earn; cnt[p.job]++; }
    let best = null, bestAvg = -1;
    for (const k of jobKeys) { const avg = cnt[k] ? sum[k] / cnt[k] : 0; if (avg > bestAvg) { bestAvg = avg; best = k; } }
    const sorted = adults.slice().sort((a, b) => wealth(a) - wealth(b) || a.id - b.id);
    const n = Math.floor(sorted.length * J.bottomShare);
    for (let i = 0; i < n; i++) {
      const p = sorted[i];
      if (p.job !== best) { log('job', p.name + ' 从' + C.jobs[p.job].name + '转行做' + C.jobs[best].name, [p.id]); p.job = best; p.skill = J.newSkill; }
    }
    for (const p of adults) p.earn = 0;
  }

  function phaseAging() {
    for (const p of S.people) if (p.alive) {
      const wasChild = p.age < C.work.adultAge;
      p.age += 1 / 365;
      if (wasChild && p.age >= C.work.adultAge) log('job', p.name + ' 成年，开始做' + C.jobs[p.job].name, [p.id]);
    }
  }

  function phaseDecay() {
    const d = C.social.relDecay;
    for (const p of S.people) {
      if (!p.alive) { if (p.rel.size) p.rel.clear(); continue; }
      for (const [id, v] of p.rel) {
        const q = S.byId.get(id);
        if (!q || !q.alive) { p.rel.delete(id); continue; }
        const nv = v * d;
        if (Math.abs(nv) < C.social.relForget) p.rel.delete(id); else p.rel.set(id, nv);
      }
    }
  }

  function step() {
    S.day++;
    S.today = newToday();
    phaseWelfare(); phaseWork(); phaseDoctor(); phaseMarket('food'); phaseMarket('goods'); phaseSocial();
    phaseFeedChildren(); phaseConsume(); phaseDeath(); phaseBirth(); phaseAging(); phaseJobSwitch(); phaseDecay();
    record();
  }

  function hash() {
    let h = 0x811c9dc5;
    const add = s => { for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } };
    add(S.day + '|' + S.prices.food.toFixed(6) + '|' + S.prices.goods.toFixed(6));
    for (const p of S.people) add([p.id, p.name, p.job, p.alive ? 1 : 0, p.money.toFixed(6), p.food.toFixed(6), p.goods.toFixed(6), p.health.toFixed(6), p.rel.size].join(','));
    return ('00000000' + (h >>> 0).toString(16)).slice(-8);
  }

  return { S, step, hash, wealth, gini, isAdult };
}

/* ===== 界面 ===== */
(function () {

  const pct = x => +(x * 100).toFixed(2) + '%';

    rel: ['关系', '#8a62b0'], heal: ['治疗', '#3b8ea5'], welfare: ['救济', '#d79b2b'], birth: ['出生', '#e07a9a'], death: ['死亡', '#555'], job: ['职业', '#8b7a55'] };

  function reset(s) {

  }

  function stepDays(n) {
    const t0 = performance.now();

  }

  function aliveCount() { return sim.S.history[sim.S.history.length - 1].alive; }

  function start() {

  function stop() { if (timer) clearInterval(timer); timer = null; const b = $('btnRun'); if (b) b.textContent = sim && sim.S.day > 0 ? '▶ 继续运行' : '▶ 自动运行'; }

  // ---------- 渲染 ----------
  function renderAll() {

    $('hashLabel').textContent = sim.hash();

      ['今日成交', h.trades], ['今日吃掉食物', h.foodEaten], ['食物价', h.foodPrice.toFixed(2)], ['物品价', h.goodsPrice.toFixed(2)]
    ];
    $('stats').innerHTML = st.map(x => '<div class="stat"><b>' + x[1] + '</b><span>' + x[0] + '</span></div>').join('');
    if (tab === 'charts') renderCharts();

  }

  function setupCanvas(cv) {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);

    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(hgt * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(hgt * dpr); }
    const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, hgt);
    return { ctx, w, h: hgt };
  }
  function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; }
  function axisLabel(v) { return Math.abs(v) >= 10000 ? (v / 10000).toFixed(v % 10000 ? 1 : 0) + '万' : (Math.abs(v) < 10 && v % 1 ? v.toFixed(2) : String(Math.round(v))); }

  function lineChart(cv, series, opt = {}) {

    const H = opt.skip0 && sim.S.history.length > 1 ? sim.S.history.slice(1) : sim.S.history, n = H.length;
    const L = 40, Rm = 8, T = 8, B = 22, pw = w - L - Rm, ph = h - T - B;
    let ymax = opt.ymax || 0;
    if (!opt.ymax) for (const s of series) for (const r of H) { const v = s.get(r); if (v > ymax) ymax = v; }
    ymax = opt.ymax || niceMax(ymax * 1.05);
    ctx.font = '10px -apple-system,sans-serif'; ctx.fillStyle = '#8a857a'; ctx.strokeStyle = '#ece6d8'; ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) { const y = T + ph - ph * i / 4; ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(L + pw, y); ctx.stroke(); ctx.textAlign = 'right'; ctx.fillText(axisLabel(ymax * i / 4), L - 4, y + 3); }
    const d0 = H[0].day, d1 = Math.max(H[n - 1].day, d0 + 1);
    ctx.textAlign = 'center';
    for (let i = 0; i <= 4; i++) { const d = d0 + (d1 - d0) * i / 4; ctx.fillText('第' + Math.round(d) + '天', Math.min(Math.max(L + pw * i / 4, L + 16), L + pw - 16), h - 6); }
    const stepN = Math.max(1, Math.floor(n / (pw * 1.5)));
    for (const s of series) {
      ctx.strokeStyle = s.color; ctx.lineWidth = 1.8; ctx.beginPath();
      let first = true;
      for (let i = 0; i < n; i += stepN) {
        const r = H[i]; const x = L + pw * (r.day - d0) / (d1 - d0); const y = T + ph - ph * Math.min(s.get(r), ymax) / ymax;
        if (first) { ctx.moveTo(x, y); first = false; } else ctx.lineTo(x, y);
      }
      const r = H[n - 1]; ctx.lineTo(L + pw * (r.day - d0) / (d1 - d0), T + ph - ph * Math.min(s.get(r), ymax) / ymax);
      ctx.stroke();
    }
  }

  function histChart(cv) {

    const L = 30, Rm = 8, T = 8, B = 30, pw = w - L - Rm, ph = h - T - B;
    ctx.font = '10px -apple-system,sans-serif'; ctx.fillStyle = '#8a857a';
    if (!alive.length) { ctx.fillText('已无在世居民', L + 10, T + 20); return; }
    const top = Math.max(1, ...alive) * 1.0001;
    const stepW = niceMax(top / 10), bins = Math.max(1, Math.ceil(top / stepW)), maxW = stepW * bins;
    const cnt = new Array(bins).fill(0);
    for (const v of alive) cnt[Math.min(bins - 1, Math.floor(Math.max(0, v) / stepW))]++;
    const cmax = niceMax(Math.max(...cnt));
    ctx.strokeStyle = '#ece6d8';
    for (let i = 0; i <= 4; i++) { const y = T + ph - ph * i / 4; ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(L + pw, y); ctx.stroke(); ctx.textAlign = 'right'; ctx.fillText(axisLabel(cmax * i / 4), L - 4, y + 3); }
    const bw = pw / bins;
    for (let i = 0; i < bins; i++) {
      const bh = ph * cnt[i] / cmax; ctx.fillStyle = COLORS.a; ctx.fillRect(L + i * bw + 2, T + ph - bh, bw - 4, bh);
      ctx.fillStyle = '#55524b'; ctx.textAlign = 'center'; if (cnt[i]) ctx.fillText(cnt[i], L + i * bw + bw / 2, T + ph - bh - 3);
    }
    ctx.fillStyle = '#8a857a';
    for (let i = 0; i <= bins; i += (bins > 6 ? 2 : 1)) { ctx.textAlign = i === 0 ? 'left' : i === bins ? 'right' : 'center'; ctx.fillText(axisLabel(maxW * i / bins), L + i * bw, h - 16); }
    ctx.textAlign = 'center'; ctx.fillText('财富（元）', L + pw / 2, h - 3);
  }

  const friendsOf = p => { let n = 0; for (const v of p.rel.values()) if (v >= C.social.friendThreshold) n++; return n; };
  function personality(p) {
    const t = [['善良', p.kind, '热心肠', '冷淡'], ['贪婪', p.greed, '精明贪财', '知足'], ['攻击性', p.aggr, '好斗', '温和'], ['社交性', p.social, '外向', '内向']];
    const out = [];
    for (const x of t) { if (x[1] >= 0.7) out.push(x[2]); else if (x[1] <= 0.3) out.push(x[3]); }
    return out.length ? out.slice(0, 3).join('·') : '中庸';
  }
  function status(p) {
    if (!p.alive) return '第' + p.deathDay + '天去世（' + p.cause + '）';
    if (p.age < C.work.adultAge) return '儿童';
    const s = [];
    if (p.satiety <= C.social.hungerSatiety) s.push('饥饿');
    if (p.health < C.doctor.healBelow) s.push('生病/受伤');
    if (p.energy < C.work.minEnergy) s.push('疲惫');
    return s.join('、') || '正常';
  }

  function renderPeople() {
    const sort = $('sortSel').value, filt = $('filterSel').value;

    const W = new Map(ps.map(p => [p.id, sim.wealth(p)]));
    const F = new Map(ps.map(p => [p.id, friendsOf(p)]));
    ps.sort(sort === 'wealth' ? (a, b) => W.get(b.id) - W.get(a.id) : sort === 'poor' ? (a, b) => W.get(a.id) - W.get(b.id)
      : sort === 'health' ? (a, b) => a.health - b.health : sort === 'friends' ? (a, b) => F.get(b.id) - F.get(a.id) : (a, b) => a.id - b.id);

      + '<h3 style="font-size:15px;margin:12px 0 2px">性格（0–100）</h3>' + bar('善良', p.kind * 100) + bar('贪婪', p.greed * 100) + bar('攻击性', p.aggr * 100) + bar('社交性', p.social * 100)

  // ---------- 规则说明（由 CONFIG 生成） ----------
  function renderRules() {
    const J = C.jobs, N = C.needs, W = C.work, M = C.market, SC = C.social, D = C.doctor, L = C.life, B = C.birth, Wf = C.welfare, JS = C.jobSwitch, I = C.init;
    const jobRows = Object.keys(J).map(k => {
      const j = J[k];
      const what = j.product === 'food' ? '生产食物' : j.product === 'goods' ? '生产物品' : k === 'merchant' ? '市场抽成' : '给人治病收费';
      return '<tr><td>' + j.name + '</td><td>' + j.count + '</td><td>' + what + '</td><td>' + (j.product ? j.base : '—') + '</td><td>' + (j.product ? '±' + pct(j.variance) : '—') + '</td></tr>';
    }).join('');
    $('tab-rules').innerHTML = `
<h2 style="margin:0 0 4px;font-size:19px">规则说明</h2>
<p class="muted">下面所有数字都是直接从模拟程序使用的参数对象 <code>CONFIG</code> 读出来的，不是另外手写的，所以和实际运行规则一定一致。没有用任何 AI 接口，全部在你的浏览器里计算。</p>
<h3>1. 基本设定</h3>
<ul>
<li>开局 <b>${C.population}</b> 位居民；在世人数达到 <b>${C.maxPopulation}</b> 人后不再有新生儿。</li>
<li>每位居民有：姓名、年龄、职业与技能熟练度、性格（善良、贪婪、攻击性、社交性，各 0–100）、现金、食物、物品、饱食度、体力、健康，以及和别人的关系分（−100 到 +100）。</li>
<li>每过一天，按顺序发生：<b>公共救济 → 工作 → 看病 → 食物市场 → 物品市场 → 社交（分享/合作/冲突/闲聊） → 喂孩子 → 吃饭和休息 → 死亡判定 → 出生 → 年龄增长 → 转行（每 ${JS.every} 天） → 关系自然淡化</b>。</li>
<li>财富 = 现金 + 食物 × 当前食物价 + 物品 × 当前物品价。</li>
</ul>
<h3>2. 初始状态</h3>
<ul>
<li>年龄在 ${I.ageMin}–${I.ageMax} 岁之间随机；技能熟练度 ${pct(I.skillMin)}–${pct(I.skillMax)}。</li>
<li>现金服从“对数正态分布”：中位数约 ${I.moneyMedian} 元，离散度 ${I.moneySpread}（所以一开始就有人穷有人富）。</li>
<li>食物 ${I.foodMin}–${I.foodMax} 份，物品 ${I.goodsMin}–${I.goodsMax} 件；饱食度和体力 ${I.needMin}–100，健康 ${I.needMin + 10}–100。</li>
<li>每人随机认识 ${I.acquaintances} 位熟人，关系分 ${I.acqRelMin}–${I.acqRelMax}。</li>
</ul>
<h3>3. 职业与工作</h3>
<table><tr><th>职业</th><th>开局人数</th><th>做什么</th><th>基础产量</th><th>运气波动</th></tr>${jobRows}</table>
<ul>
<li>满 ${W.adultAge} 岁才工作。体力 ≥ ${W.minEnergy} 且健康 ≥ ${W.minHealth} 时当天会去工作，消耗 ${W.energyCost} 体力。</li>
<li>产量 = 基础产量 × (${W.skillFactorBase} + 技能) × (${1 - W.healthWeight} + ${W.healthWeight} × 健康/100) × 合作加成 × 运气。合作加成：前一天和人合作过则 ×${1 + W.coopBoost}（用一次就消失）。</li>
<li>每工作一天技能 +${pct(W.skillGain)}，最高 100%。</li>
<li>商人不生产东西：只要当天有商人工作，所有市场成交都要额外付 ${pct(M.merchantFee)} 手续费，平分给当天工作的商人。</li>
<li>医生见第 6 条。</li>
</ul>
<h3>4. 生存需求（吃饭、休息、健康）</h3>
<ul>
<li>每天饱食度 −${N.satietyDecay}。吃 1 份食物饱食度 +${N.satietyPerFood}，一天最多吃 ${N.maxFoodPerDay} 份，吃到 ${N.eatUntil} 以上就不吃了。</li>
<li>成年人每天消耗 ${N.goodsPerDay} 件物品（柴火、工具等）。休息恢复体力 = ${N.restBase} + （用了物品再 +${N.restGoodsBonus}） + （饱食度 > ${N.fedThreshold} 再 +${N.restFedBonus}），体力最高 100。</li>
<li>饱食度降到 0：健康 −${N.starveHealthLoss}/天。体力低于 ${N.exhaustedEnergy}：健康 −${N.exhaustedHealthLoss}/天。饱食度 > ${N.regenSatiety} 且体力 > ${N.regenEnergy}：健康 +${N.healthRegen}/天。</li>
<li>存着的食物每天腐坏 ${pct(C.spoil.foodRate)}；物品不会坏。</li>
</ul>
<h3>5. 市场交易（自主买卖）</h3>
<ul>
<li>食物：手上少于 ${M.foodTarget} 份的成年人想买到 ${M.foodTarget} 份；多于 ${M.foodSellAbove} 份的人把超出部分拿去卖。物品：少于 ${M.goodsTarget} 件想买，多于 ${M.goodsSellAbove} 件的卖。</li>
<li>卖家报价 = 当前市价 × (1 + ${M.greedMarkup} × 贪婪度)，越贪越贵。买家随机排队，每人从最便宜的卖家开始买，钱不够就买不了。</li>
<li>每成交一笔，买卖双方关系 +${M.tradeRelGain}。</li>
<li>价格随供需变化：新价格 = 旧价格 × (1 + ${M.priceAdjust} × (想买的总量 − 拿出来卖的总量) ÷ (两者之和))，限制在 ${M.priceMin}–${M.priceMax} 元之间。开局食物 ${M.foodPrice0} 元/份，物品 ${M.goodsPrice0} 元/件。</li>
</ul>
<h3>6. 医生</h3>
<ul><li>每位当天工作的医生最多治疗 ${D.maxPatients} 位健康低于 ${D.healBelow} 的人（最严重的优先，医生不给自己治），每次健康 +${D.healAmount}，收费 ${D.fee} 元。病人付不起时，只有善良度高于 ${pct(D.freeKind)} 的医生会免费治。</li></ul>
<h3>7. 社交：分享、合作、冲突、关系</h3>
<ul>
<li>每位成年人每天主动见 ${SC.meetBase} + 四舍五入(社交性 × ${SC.meetExtra}) 个人。有 ${pct(SC.friendPick)} 的机会优先找朋友，否则随机找人。</li>
<li><b>分享</b>：如果对方食物少于 ${SC.shareNeedFood} 份、自己多于 ${SC.shareGiverMin} 份、自己善良度高于 ${pct(SC.shareKind)}、两人关系不是负数，就送对方最多 ${SC.shareMax} 份食物（不会让自己低于 ${SC.shareGiverMin} 份），关系 +${SC.shareRelGain}。</li>
<li>然后按概率决定这次见面是冲突、合作还是闲聊：
<ul>
<li>冲突概率 = ${SC.conflictBase} + ${SC.conflictAggr} × 两人平均攻击性 + （自己饱食度低于 ${SC.hungerSatiety} 时 +${SC.conflictHunger}） + （对方财富超过自己 ${SC.envyRatio} 倍时 +${SC.conflictEnvy} × 自己的贪婪度） − ${SC.conflictRel} × 关系分。</li>
<li>合作概率 = ${SC.coopBase} + ${SC.coopKind} × 两人平均善良度 + ${SC.coopRel} × 关系分。</li>
<li>两种概率都限制在 0–${SC.maxProb}。剩下的情况是闲聊，关系 +${SC.chatRelGain}。</li>
</ul></li>
<li><b>合作</b>：两人一起干活，第二天产量加成（见第 3 条），关系 +${SC.coopRelGain}。</li>
<li><b>冲突</b>：比较 “健康×${SC.fightHealthW} + 体力×${SC.fightEnergyW} + 攻击性×${SC.fightAggrW} + 0~${SC.fightLuck} 的运气”，高者赢。输家被抢走 ${pct(SC.robRate)} 的现金（最多 ${SC.robMax} 元），健康 −${SC.loserHealthLoss}；赢家也受伤，健康 −${SC.winnerHealthLoss}。关系 −${SC.conflictRelLoss}。</li>
<li>关系分 ≥ ${SC.friendThreshold} 算朋友，≤ ${SC.enemyThreshold} 算仇人。跨过这些线时会在事件里记录“成为朋友 / 友谊破裂 / 结仇”。每天所有关系分 × ${SC.relDecay}（慢慢淡化；绝对值小于 ${SC.relForget} 时就忘了对方，关系删除）。</li>
</ul>
<h3>8. 公共救济（资源再分配）</h3>
<ul><li>${Wf.enabled ? '开启。' : '关闭。'}每天开始时，成年人现金超过 ${Wf.taxThreshold} 元的部分收 ${pct(Wf.taxRate)} 的税，全部平均发给现金少于 ${Wf.povertyLine} 元的成年人（如果没有穷人，就平均发给所有成年人）。</li></ul>
<h3>9. 死亡与继承</h3>
<ul>
<li>健康降到 0 就会去世：当时饱食度为 0 记作“饥饿”，否则记作“伤病”。</li>
<li>超过 ${L.oldAge} 岁后，每天有 ${L.oldAgeRisk} × (年龄 − ${L.oldAge}) 的概率因年老去世。</li>
<li>遗产（现金、食物、物品）先给在世的孩子，没有孩子就给关系分最高的人（必须大于 0），都没有则遗产散失。</li>
</ul>
<h3>10. 出生（可选规则，当前${B.enabled ? '开启' : '关闭'}）</h3>
<ul>
<li>两位 ${B.minAge}–${B.maxAge} 岁、关系分 ≥ ${B.partnerRel}、饱食度都 ≥ ${B.minSatiety}、两人现金合计 ≥ ${B.minMoney} 元的居民，每天有 ${pct(B.dailyChance)} 的概率生孩子；每人生育后要隔 ${B.cooldown} 天。</li>
<li>父母各给孩子最多 ${B.giftEach} 元。孩子每项性格 = 父母平均值 + 随机（±${B.traitNoise / 2}，限制在 0–1），和父母关系分 ${B.parentRel}；出生时饱食度 ${B.babySatiety}、体力 ${B.babyEnergy}、健康 ${B.babyHealth}。</li>
<li>孩子不工作也不参与社交，每天由父母（父母都不在了，就由一位食物最多的善良成年人）喂 ${L.childFoodPerDay} 份食物，${W.adultAge} 岁成年后做父母一方的职业。</li>
</ul>
<h3>11. 转行</h3>
<ul><li>每 ${JS.every} 天，统计过去这段时间各职业的平均收入；财富最低的 ${pct(JS.bottomShare)} 成年人改行去做平均收入最高的职业，技能重置为 ${pct(JS.newSkill)}。</li></ul>
<h3>12. 统计口径</h3>
<ul>
<li>基尼系数：把在世居民的财富从小到大排序，用标准公式 G = 2Σ(i·xᵢ)/(n·Σxᵢ) − (n+1)/n 计算（负财富按 0 算）。</li>
<li>“今日事件”每天最多记录 ${C.limits.logPerDay} 条（超出部分只计数）；每位居民保留最近 ${C.limits.personalLog} 条经历；图表最多保留 ${C.limits.historyDays} 天历史。</li>
</ul>
<h3>13. 随机种子（可复现）</h3>
<ul><li>所有随机数都由 mulberry32 伪随机算法从“种子”生成，不使用 Math.random。相同种子 + 相同操作 = 完全相同的结果（可以看页面上的“状态指纹”核对）。网址后面加 <code>?seed=数字</code> 也能指定种子。默认种子 ${C.defaultSeed}。</li></ul>
<details><summary>查看原始参数 CONFIG</summary><pre>${esc(JSON.stringify(C, null, 2))}</pre></details>`;
  }

  // ---------- 事件绑定 ----------
  $('btnStep').onclick = () => { stop(); stepDays(1); };
  $('btnStep30').onclick = () => { stop(); stepDays(30); };
  $('btnRun').onclick = () => { if (timer) stop(); else start(); };
  $('speed').onchange = () => { if (timer) { stop(); start(); } };
  $('btnReset').onclick = () => { const v = $('seedInput').value.trim(); reset(/^\d+$/.test(v) ? Number(v) : seed); };
  $('btnRandSeed').onclick = () => { $('seedInput').value = Math.floor(Math.random() * 1e9); };
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
    tab = b.dataset.tab;
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
    for (const t of ['charts', 'people', 'log', 'rules']) $('tab-' + t).classList.toggle('hide', t !== tab);
    renderAll();
    const tabs = document.querySelector('.tabs'); if (tabs.getBoundingClientRect().top < 1) window.scrollTo(0, $('tab-' + tab).offsetTop - tabs.offsetHeight - 8);
  });
  $('sortSel').onchange = renderPeople; $('filterSel').onchange = renderPeople; $('logFilter').onchange = renderLog;
  $('plist').onclick = e => { const b = e.target.closest('[data-id]'); if (b) openDetail(Number(b.dataset.id)); };
  $('panel').onclick = e => { if (e.target.id === 'btnClose') return closeDetail(); const b = e.target.closest('[data-id]'); if (b) openDetail(Number(b.dataset.id)); };
  $('sheet').onclick = e => { if (e.target.id === 'sheet') closeDetail(); };
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (tab === 'charts') renderCharts(); }, 150); });

  renderRules();
  reset(seed);
  window.__ms = { sim: () => sim, stepDays, reset, openDetail, closeDetail, stop };
})();

</script>
